name: Setup Node and pnpm
description: Setup the workspace Node.js and pnpm environment.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '24'
  install:
    description: Install workspace dependencies from the repository root.
    required: false
    default: 'true'
  doctor:
    description: Run pnpm diagnostics after pnpm setup.
    required: false
    default: 'true'
  cache:
    description: Enable pnpm dependency caching.
    required: false
    default: 'true'
  registry-url:
    description: Optional npm registry URL for publish-related jobs.
    required: false
    default: 'https://registry.npmjs.org'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        cache-dependency-path: pnpm-lock.yaml

    - name: Setup pnpm
      uses: pnpm/action-setup@v6.0.9
      with:
        package_json_file: package.json
        run_install: false

    - name: pnpm doctor
      if: inputs.doctor == 'true'
      shell: bash
      run: |
        pnpm_version="$(pnpm --version)"
        if [[ "$pnpm_version" == "11.14.0" ]] || [[ "$(printf '%s\n%s\n' '11.14.0' "$pnpm_version" | sort -V | head -n 1)" != "11.14.0" ]]; then
          echo "Skipping pnpm doctor: pnpm must be newer than 11.14.0; found $pnpm_version."
          exit 0
        fi

        pnpm doctor

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
