name: Setup pnpm
description: Setup the workspace Node.js and pnpm environment.

inputs:
  install:
    description: Install workspace dependencies from the repository root.
    required: false
    default: 'true'
  doctor:
    description: Run pnpm diagnostics after pnpm setup.
    required: false
    default: 'true'
  cache:
    description: Enable pnpm dependency caching.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/setup@v1.0.0
      with:
        cache: ${{ inputs.cache }}
        cache-dependency-path: pnpm-lock.yaml
        package-json-file: package.json
        install: false

    - name: pnpm doctor
      if: inputs.doctor == 'true'
      shell: bash
      run: pnpm doctor

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
