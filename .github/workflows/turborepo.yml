name: Turborepo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/turborepo.yml'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  pull_request:
    paths:
      - '.github/workflows/turborepo.yml'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint workspace
        run: pnpm lint

      - name: Run package tests
        run: pnpm turbo run test --filter='./packages/*'

      - name: Run package typecheck
        run: pnpm turbo run typecheck --filter='./packages/*'

      - name: Run package builds
        run: pnpm turbo run build:ci --filter='./packages/*'

      - name: Run app typecheck
        run: pnpm turbo run typecheck:app --filter='./apps/*'

      - name: Run app builds
        run: pnpm turbo run build:app --filter='./apps/*'
