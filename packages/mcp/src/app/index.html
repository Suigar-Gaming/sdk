<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Suigar Transaction Inspector</title>
		<script type="module" src="./main.ts"></script>
	</head>
	<body>
		<main class="shell">
			<header class="header">
				<div>
					<p class="eyebrow">Suigar MCP</p>
					<h1>Transaction Inspector</h1>
				</div>
				<div id="status" class="status">Waiting for tool result</div>
			</header>

			<section class="grid">
				<div class="panel">
					<h2>Context</h2>
					<dl id="context"></dl>
				</div>

				<div class="panel">
					<h2>Transaction</h2>
					<dl id="summary"></dl>
				</div>
			</section>

			<section class="panel">
				<h2>Targets</h2>
				<ul id="targets" class="targets"></ul>
			</section>

			<section class="panel">
				<h2>Result</h2>
				<pre id="result">{}</pre>
			</section>
		</main>
	</body>
</html>
